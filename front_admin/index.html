<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin 接单</title>
    <link rel="stylesheet" href="/style/main.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <h1>Admin 接单看板</h1>
        <p>按照桌号/包厢实时接收订单，支持状态流转（新单 -> 制作中 -> 待上桌 -> 已完成）。</p>
      </section>

      <section id="employeeLoginCard" class="card" style="margin-top: 14px">
        <h2>员工登录</h2>
        <div class="row wrap" style="margin-top: 8px">
          <input id="employeeUsernameInput" placeholder="用户名" style="max-width: 220px" />
          <input id="employeePasswordInput" type="password" placeholder="密码" style="max-width: 220px" />
          <button id="employeeLoginBtn" class="secondary">登录</button>
        </div>
        <p id="employeeLoginMsg" class="small muted" style="margin-bottom: 0"></p>
      </section>

      <section class="card" style="margin-top: 18px">
        <div class="row wrap" style="justify-content: space-between">
          <div class="row wrap">
            <span id="currentEmployeeLabel" class="small muted">当前员工：未登录</span>
            <label for="statusFilter" class="small muted">状态筛选</label>
            <select id="statusFilter" style="width: 170px">
              <option value="">全部</option>
              <option value="new">新单</option>
              <option value="preparing">制作中</option>
              <option value="ready">待上桌</option>
              <option value="served">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
          </div>
          <div class="row wrap">
            <button class="light" id="employeeLogoutBtn">退出登录</button>
            <button class="light" id="soundToggleBtn">Sound Off</button>
            <button class="light" id="refreshBtn">立即刷新</button>
            <span id="lastUpdated" class="small muted">未刷新</span>
          </div>
        </div>
      </section>

      <section class="admin-board" style="margin-top: 16px">
        <article class="card">
          <h2>桌号 / 包厢待办</h2>
          <p class="small muted">显示当前包厢状态与访问码，可直接“结单清零”。</p>
          <div id="zoneTodoWrap" class="grid" style="margin-top: 8px"></div>
        </article>

        <article class="card">
          <h2>来单信息</h2>
          <p id="writeQueueStatus" class="small muted">写入队列：-</p>
          <div id="ordersWrap" class="grid admin-orders-grid" style="margin-top: 8px"></div>
        </article>
      </section>

      <div id="zoneSessionDrawerBackdrop" class="admin-drawer-backdrop" hidden></div>
      <aside id="zoneSessionDrawer" class="admin-drawer" aria-hidden="true">
        <div class="admin-drawer-head">
          <div>
            <h3 id="zoneSessionTitle">包厢订单</h3>
            <div id="zoneSessionMeta" class="small muted"></div>
          </div>
          <button class="light" id="zoneSessionCloseBtn" aria-label="关闭">✕</button>
        </div>
        <div id="zoneSessionOrdersWrap" class="admin-drawer-body"></div>
        <div class="admin-drawer-footer">
          <button class="warn" id="zoneSessionCheckoutBtn">结单清零</button>
        </div>
      </aside>
    </main>

    <script src="/front_admin/app.js"></script>
  </body>
</html>
