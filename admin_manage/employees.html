<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin 经营后台 · 员工</title>
    <link rel="stylesheet" href="/style/main.css" />
  </head>
  <body>
    <main class="app-shell manage-shell" style="width: min(1400px, 96vw);">
      <section class="manage-layout" style="display: grid; grid-template-columns: minmax(200px, 240px) minmax(0, 1fr); gap: 20px; align-items: start;">
        <aside class="manage-nav">
          <div class="manage-nav-header">
            <h1>Admin</h1>
            <p>经营后台</p>
          </div>
          <nav>
            <a class="manage-nav-link" href="/admin_manage/index.html">
              <span class="manage-nav-icon">📊</span>
              <span>概览</span>
            </a>
            <a class="manage-nav-link" href="/admin_manage/menu.html">
              <span class="manage-nav-icon">🍽️</span>
              <span>菜单</span>
            </a>
            <a class="manage-nav-link" href="/admin_manage/zones.html">
              <span class="manage-nav-icon">🪑</span>
              <span>桌台二维码</span>
            </a>
            <a class="manage-nav-link" href="/admin_manage/reports.html">
              <span class="manage-nav-icon">📈</span>
              <span>报表</span>
            </a>
            <a class="manage-nav-link active" href="/admin_manage/employees.html">
              <span class="manage-nav-icon">👥</span>
              <span>员工</span>
            </a>
          </nav>
        </aside>

        <section class="manage-main">
          <header class="page-header">
            <div class="page-header-left">
              <h1>员工</h1>
              <p>独立管理员工账号</p>
            </div>
          </header>

          <section class="manage-section">
            <div class="section-header">
              <h2 class="section-title">新增员工</h2>
            </div>
            <div class="section-body">
              <div class="form-row">
                <input id="employeeDisplayNameInput" placeholder="真实姓名" />
                <input id="employeeUsernameInput" placeholder="用户名" />
                <input id="employeePasswordInput" type="password" placeholder="密码" />
                <button id="addEmployeeBtn" class="btn-ghost">新增</button>
                <span id="employeeManageMsg" class="section-subtitle"></span>
              </div>
            </div>
          </section>

          <section class="manage-section">
            <div class="section-header">
              <h2 class="section-title">员工列表</h2>
            </div>
            <div class="section-body">
              <table class="table">
                <thead>
                  <tr>
                    <th>真实姓名</th>
                    <th>用户名</th>
                    <th>新密码</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="employeeTbody"></tbody>
              </table>
            </div>
          </section>
        </section>
      </section>
    </main>
    <script src="/admin_manage/app.js"></script>
  </body>
</html>
