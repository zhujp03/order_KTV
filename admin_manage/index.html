<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin 经营后台 · 概览</title>
    <link rel="stylesheet" href="/style/main.css" />
  </head>
  <body>
    <main class="app-shell manage-shell" style="width: min(1400px, 96vw);">
      <section class="manage-layout" style="display: grid; grid-template-columns: minmax(200px, 240px) minmax(0, 1fr); gap: 20px; align-items: start;">
        <aside class="manage-nav">
          <div class="manage-nav-header">
            <h1>Admin</h1>
            <p>经营后台</p>
          </div>
          <nav>
            <a class="manage-nav-link active" href="/admin_manage/index.html">
              <span class="manage-nav-icon">📊</span>
              <span>概览</span>
            </a>
            <a class="manage-nav-link" href="/admin_manage/menu.html">
              <span class="manage-nav-icon">🍽️</span>
              <span>菜单</span>
            </a>
            <a class="manage-nav-link" href="/admin_manage/zones.html">
              <span class="manage-nav-icon">🪑</span>
              <span>桌台二维码</span>
            </a>
            <a class="manage-nav-link" href="/admin_manage/reports.html">
              <span class="manage-nav-icon">📈</span>
              <span>报表</span>
            </a>
            <a class="manage-nav-link" href="/admin_manage/employees.html">
              <span class="manage-nav-icon">👥</span>
              <span>员工</span>
            </a>
          </nav>
        </aside>

        <section class="manage-main">
          <header class="page-header">
            <div class="page-header-left">
              <h1>概览</h1>
              <p>经营摘要与快捷入口</p>
            </div>
            <div class="page-header-right">
              <span class="page-date" id="pageDate"></span>
            </div>
          </header>

          <section class="summary-cards">
            <div class="summary-card">
              <div class="summary-card-label">今日下单金额</div>
              <div class="summary-card-value" id="statAmount">$0.00</div>
            </div>
            <div class="summary-card">
              <div class="summary-card-label">今日订单数</div>
              <div class="summary-card-value" id="statOrders">0</div>
            </div>
            <div class="summary-card">
              <div class="summary-card-label">当前开台桌数</div>
              <div class="summary-card-value" id="statOpen">0</div>
            </div>
            <div class="summary-card">
              <div class="summary-card-label">当前可结单桌数</div>
              <div class="summary-card-value" id="statCheckout">0</div>
            </div>
            <div class="summary-card">
              <div class="summary-card-label">进行中订单桌数</div>
              <div class="summary-card-value" id="statActive">0</div>
            </div>
            <div class="summary-card">
              <div class="summary-card-label">当前员工数</div>
              <div class="summary-card-value" id="statEmployees">0</div>
            </div>
          </section>

          <section class="quick-links-section">
            <h2 class="section-title">功能入口</h2>
            <div class="quick-links-grid">
              <a class="quick-link-card" href="/admin_manage/menu.html">
                <div class="quick-link-icon">🍽️</div>
                <div class="quick-link-title">菜单管理</div>
                <div class="quick-link-desc">按分类维护菜品</div>
                <div class="quick-link-action">进入 →</div>
              </a>
              <a class="quick-link-card" href="/admin_manage/zones.html">
                <div class="quick-link-icon">🪑</div>
                <div class="quick-link-title">桌台二维码</div>
                <div class="quick-link-desc">生成与管理桌台</div>
                <div class="quick-link-action">进入 →</div>
              </a>
              <a class="quick-link-card" href="/admin_manage/reports.html">
                <div class="quick-link-icon">📈</div>
                <div class="quick-link-title">经营报表</div>
                <div class="quick-link-desc">查看订单统计</div>
                <div class="quick-link-action">进入 →</div>
              </a>
              <a class="quick-link-card" href="/admin_manage/employees.html">
                <div class="quick-link-icon">👥</div>
                <div class="quick-link-title">员工管理</div>
                <div class="quick-link-desc">账号与权限</div>
                <div class="quick-link-action">进入 →</div>
              </a>
            </div>
          </section>

          <section class="system-note">
            <h2 class="section-title">系统说明</h2>
            <div class="note-content">系统默认不接入第三方统计、不加载第三方字体脚本、不记录设备指纹。</div>
          </section>
        </section>
      </section>
    </main>
    <script src="/admin_manage/app.js"></script>
  </body>
</html>
